services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RELAY: hbbr:21117
      ENCRYPTED_ONLY: "1"
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118/tcp"
    volumes:
      - hbbs_data:/root
    networks:
      - rustdesk_net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117/tcp"
      - "21119:21119/tcp"
    volumes:
      - hbbr_data:/root
    networks:
      - rustdesk_net

  rustdesk-api:
    image: lejianwen/rustdesk-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      PORT: 21114
      API_KEY: ${RUSTDESK_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      RUSTDESK_API_KEY: ${RUSTDESK_API_KEY}
    expose:
      - "21114"
    volumes:
      - hbbs_data:/data:ro
      - ./rustdesk-api/config.yaml:/app/conf/config.yaml:ro
    depends_on:
      - hbbs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:21114 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rustdesk_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 호스트 5434 → 컨테이너 5432. prisma migrate dev (호스트에서) 또는 psql 디버깅용.
      # 5432는 다른 프로젝트(polywatch-postgres)가 이미 사용 중일 수 있어 5434 채택.
      # 운영 환경에서는 외부 노출 불필요하면 이 ports 블록을 주석 처리.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rustdesk_net

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        NEXT_PUBLIC_WEBRTC_ICE_SERVERS: >-
          [{"urls":["stun:stun.l.google.com:19302"]},
           {"urls":["turn:${TURN_HOST}:3478?transport=udp","turn:${TURN_HOST}:3478?transport=tcp"],"username":"${TURN_USER}","credential":"${TURN_PASSWORD}"}]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      RUSTDESK_API_BASE_URL: http://rustdesk-api:21114
      RUSTDESK_API_KEY: ${RUSTDESK_API_KEY}
      RUSTDESK_DOMAIN: ${RUSTDESK_DOMAIN}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      CLIENT_DOWNLOAD_URL: https://github.com/rustdesk/rustdesk/releases
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS}
      STREAM_PLAYBACK_TOKEN_SECRET: ${STREAM_PLAYBACK_TOKEN_SECRET}
      STREAM_PLAYBACK_TOKEN_TTL: ${STREAM_PLAYBACK_TOKEN_TTL}
      STREAM_RECORDINGS_DEFAULT_RETENTION_DAYS: ${STREAM_RECORDINGS_DEFAULT_RETENTION_DAYS}
      STREAM_PUBLIC_BASE: ${STREAM_PUBLIC_BASE}
      STREAM_DATA_DIR: /var/streams
      STREAM_WATERMARK_DEFAULT: ${STREAM_WATERMARK_DEFAULT}
      # WebRTC ICE servers for browser player (client-side)
      # NOTE: 이 값은 브라우저로 내려가므로 장기 비밀번호를 넣기보단 추후 "에페메럴 TURN 크리덴셜"로 개선 권장.
      NEXT_PUBLIC_WEBRTC_ICE_SERVERS: >-
        [{"urls":["stun:stun.l.google.com:19302"]},
         {"urls":["turn:${TURN_HOST}:3478?transport=udp","turn:${TURN_HOST}:3478?transport=tcp"],"username":"${TURN_USER}","credential":"${TURN_PASSWORD}"}]
    ports:
      # 호스트 3010은 Tosino solution-main 등 다른 서비스와 공유 시 충돌 → housing 대시보드는 3011
      - "3011:3000"
    volumes:
      - streams_data:/var/streams
    depends_on:
      postgres:
        condition: service_healthy
      rustdesk-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - rustdesk_net

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    env_file:
      - .env
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=${TURN_REALM}"
      - "--server-name=${TURN_HOST}"
      - "--user=${TURN_USER}:${TURN_PASSWORD}"
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-cli"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    networks:
      - rustdesk_net

networks:
  rustdesk_net:
    driver: bridge

volumes:
  hbbs_data:
  hbbr_data:
  postgres_data:
  streams_data:
